services:
  # خدمة التطبيق (Laravel + PHP + Node/Vite)
  laravel.test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: rada_system_app:latest
    container_name: laravel_prod
    restart: always
    hostname: laravel.prod
    user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
    env_file:
      - .env.production
    volumes:
      - ./:/var/www/html:ro
      - /var/www/html/storage
    depends_on:
      - db
      - redis
      - meilisearch
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # خادم الويب Nginx مع SSL
  web:
    image: nginx:1.25-alpine
    container_name: laravel_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/ssl/certs:ro
    depends_on:
      - laravel.test
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # قاعدة البيانات MySQL
  db:
    image: mysql:8.0
    container_name: laravel_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD_PROD}
    volumes:
      - dbdata_prod:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # خدمة Redis للكاش والـ Queues
  redis:
    image: redis:7-alpine
    container_name: laravel_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata_prod:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # خدمة Meilisearch للبحث
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: laravel_meilisearch_prod
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilidata_prod:/meili_data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dbdata_prod:
  redisdata_prod:
  meilidata_prod:

networks:
  app-network:
    driver: bridge
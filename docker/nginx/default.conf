server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /@vite {
        proxy_pass http://laravel.test:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/@ {
        proxy_pass http://laravel.test:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve built assets from disk if present, otherwise proxy to Vite dev server
    location /build/ {
        root /var/www/html/public;
        try_files $uri $uri/ @vite;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Try serving static files from disk, fallback to Vite when missing (dev)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/html/public;
        # First try the built assets directory (public/build), then regular public,
        # finally proxy to Vite only if still not found.
        try_files /build$uri /build$uri/ $uri $uri/ @vite;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy endpoint to Vite dev server
    location @vite {
        # Only proxy to Vite when the hot file exists (Vite running).
        # If the hot file is missing, return 404 instead of attempting to proxy
        # (which causes 502 when Vite is down).
        if (!-f /var/www/html/public/hot) {
            return 404;
        }
        proxy_pass http://laravel.test:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        alias /var/www/html/public/build/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass laravel.test:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}

services:
  # خدمة التطبيق (Laravel + PHP + Node/Vite)
  laravel.test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # لتجنب مشاكل الصلاحيات في أوبنتو
        WWWGROUP: '${WWWGROUP:-1000}'
    image: rada_system_app
    container_name: laravel.test
    restart: always
    hostname: laravel.test
    # ضبط المستخدم ليتوافق مع مستخدم جهازك في أوبنتو
    user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      # لإجبار Vite على مراقبة التغييرات في Docker
      CHOKIDAR_USEPOLLING: 'true'
      VITE_REVERB_APP_KEY: 'local'
      VITE_REVERB_HOST: 'localhost'
      VITE_REVERB_PORT: '8082'
      VITE_REVERB_SCHEME: 'http'
    volumes:
      - ./:/var/www/html:delegated
      # حماية المكتبات من التداخل مع ملفات النظام المضيف
      - /var/www/html/node_modules
    ports:
      - "5173:5173" # منفذ Vite للـ Hot Reload
    depends_on:
      - db
      - redis
    networks:
      app-network:
        aliases:
          - laravel.test

  # خادم الويب Nginx
  web:
    image: nginx:1.25-alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel.test
    networks:
      - app-network

  # قاعدة البيانات MySQL
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: erp
      MYSQL_USER: erpuser
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "erpuser", "-psecret"]
      timeout: 20s
      retries: 10

  # خدمة Redis للكاش والـ Queues
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  # خدمة Meilisearch للبحث
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: laravel_meilisearch
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: 'masterKey'
    volumes:
      - meilidata:/meili_data
    networks:
      - app-network

  # خدمة Reverb للبث الحي
  reverb:
    image: rada_system_app
    container_name: laravel_reverb
    restart: always
    working_dir: /var/www/html
    # Wait for DB to be reachable before starting the long-running artisan command.
    # Uses a short PHP loop (available in the app image) to probe TCP port 3306 on host 'db'.
    # This prevents the process from starting while MySQL is restarting and avoids immediate
    # connection-refused failures.
    # Wait for TCP port 3306 on host 'db' using bash /dev/tcp (avoids PHP quoting issues).
    command: ["bash", "-lc", "until echo > /dev/tcp/db/3306 2>/dev/null; do echo 'Waiting for db:3306...'; sleep 1; done; php artisan reverb:start --host=0.0.0.0 --port=8082"]
    environment:
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8082
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: erp
      DB_USERNAME: erpuser
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./:/var/www/html:delegated
      # حماية المكتبات من التداخل مع ملفات النظام المضيف
      - /var/www/html/node_modules
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      laravel.test:
        condition: service_started
    networks:
      - app-network

  # واجهة إدارة قاعدة البيانات
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: laravel_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  dbdata:
  meilidata:

networks:
  app-network:
    driver: bridge